<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" fill="none">
  <defs>
    <linearGradient id="omniGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- App Icon Symbol -->
  <g transform="translate(15, 10)">
    <rect width="100" height="100" rx="26" fill="url(#omniGrad)" />
    <circle cx="50" cy="50" r="28" stroke="white" stroke-width="8" stroke-linecap="round" stroke-dasharray="140 40" fill="none" />
    <circle cx="50" cy="50" r="10" fill="white" />
  </g>
  <!-- Wordmark -->
  <text x="135" y="78" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" letter-spacing="-2" fill="currentColor">
    omni
  </text>
  <text x="310" y="48" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="3" fill="#8B5CF6" text-transform="uppercase">
    STUDENT
  </text>
</svg>
